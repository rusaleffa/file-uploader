<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Big Image Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app">
    <header id="toolbar">
        <input type="file" id="file" accept="image/*" />

        <label for="decoder">Декодер:</label>
        <select id="decoder"></select>

        <button id="cancel" disabled>Отмена</button>

        <div id="status">Выберите изображение</div>
        <progress id="progress" max="100" value="0" hidden></progress>
    </header>

    <div id="decoder-info"></div>

    <main id="viewport">
        <div id="spacer"></div>
        <div id="tiles"></div>
    </main>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
